name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should GetPaper behave? If Outline or another wiki already does this, describe or link it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
