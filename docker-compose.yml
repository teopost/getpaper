name: getpaper

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex -d codex"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: getpaper:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://codex:codex@postgres:5432/codex
      # Public URL used to build invite and share links
      URL: ${URL:-http://localhost:3000}
      # Set to "false" to allow new accounts only through invites
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      MAX_UPLOAD_MB: 25
      # Max size of a ZIP archive accepted by the bulk importer
      IMPORT_MAX_MB: 500
      RUST_LOG: info,sqlx=warn
      # Outgoing email for invitations (SMTP_SECURE: ssl for port 465, starttls, none)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # Accounts that are always superadmins (comma separated), e.g. to recover access
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      # Defaults for users who haven't set their own preference (Settings → Profile)
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      DEFAULT_THEME: ${DEFAULT_THEME:-system}
      DEFAULT_CONTENT_WIDTH: ${DEFAULT_CONTENT_WIDTH:-normal}
      # --- Microsoft Entra ID (Azure AD) single sign-on ---
      # Redirect URI to register in the app registration: ${URL}/auth/microsoft/callback
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      # Directory (tenant) id; "organizations" accepts any work/school account
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-organizations}
      # Optional: only these email domains may sign in (comma separated)
      MICROSOFT_ALLOWED_DOMAINS: ${MICROSOFT_ALLOWED_DOMAINS:-}
      # Create accounts automatically on first Microsoft sign-in
      MICROSOFT_AUTO_PROVISION: ${MICROSOFT_AUTO_PROVISION:-true}
      # Redirect URI path: /auth/microsoft/callback, or /auth/azure.callback to reuse an Outline app registration
      MICROSOFT_CALLBACK_PATH: ${MICROSOFT_CALLBACK_PATH:-/auth/microsoft/callback}
      # Other single sign-on providers (optional): Google, Slack and any OpenID Connect provider.
      # Redirect URI: ${URL}/auth/google/callback, /auth/slack/callback, /auth/oidc/callback.
      # *_AUTO_PROVISION: create accounts at the first sign-in (empty: same as ALLOW_SIGNUP)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GOOGLE_AUTO_PROVISION: ${GOOGLE_AUTO_PROVISION:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_ALLOWED_DOMAINS: ${SLACK_ALLOWED_DOMAINS:-}
      SLACK_AUTO_PROVISION: ${SLACK_AUTO_PROVISION:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-false}
      # Sign-in with a link sent by email (needs SMTP) and with passkeys
      EMAIL_LOGIN: ${EMAIL_LOGIN:-false}
      PASSKEYS: ${PASSKEYS:-false}
      # Webhooks may call addresses of the local network
      WEBHOOKS_ALLOW_PRIVATE: ${WEBHOOKS_ALLOW_PRIVATE:-false}
      # Set to "false" to allow only Microsoft sign-in
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-true}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
